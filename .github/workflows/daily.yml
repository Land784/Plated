name: Daily menu notification

on:
  schedule:
    # 10:00 UTC daily -- adjust to your preferred local time.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run notification pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m menu notify
