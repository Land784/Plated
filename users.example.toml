# Template for a subscriber file. Copy it into a `users/` directory and
# edit, e.g. `cp users.example.toml users/wes.toml`.
#
# This template deliberately lives OUTSIDE `users/`, because `dispatch`
# sends to every file in that directory -- a placeholder left there would
# push real notifications to the guessable topic below.
#
# `users/` is gitignored here. Real subscriber files belong in the
# private runner repo. An ntfy topic is open pub/sub: anyone who knows
# the name can both read your notifications and publish fake ones to your
# phone, so treat it like a password and generate something unguessable.
#
# Generate one with the command below. Do NOT use secrets.token_urlsafe:
# ntfy topics are case-sensitive and get typed into a phone by hand, and
# that alphabet mixes case and includes 0/O and 1/l/I, which people
# reliably mistype. This alphabet excludes every confusable character.
#
#     python3 -c "import secrets; a='abcdefghjkmnpqrstuvwxyz23456789'; \
#       print('plated-' + ''.join(secrets.choice(a) for _ in range(16)))"

name = "Example"
ntfy_topic = "CHANGE-ME-to-something-unguessable"

# Eastern time; South Bend observes it. DST is handled automatically.
timezone = "America/New_York"

# North and South share only about 28% of their items on a given day, so
# both are included by default.
halls = ["north-dining-hall", "south-dining-hall"]

# Build-your-own stations list individual ingredients rather than dishes,
# so each station is capped and the rest collapses into "+N more".
max_items_per_station = 4

# Allowlist of stations you actually eat at. Matching ignores case and a
# leading "The", so "Global Compass" also matches North's spelling,
# "The Global Compass". Anything not listed here is never shown.
stations = [
  "Domer Diner",
  "La Mesa",
  "Mezze",
  "Crust & Co",
  "Green & Grains",
  "Comfort Kitchen",
  "Athenian Rice Bowl",
  "Global Compass",
  "Curry Bar",
  "Harvest Bowl",
  "Pastaria",
  "Pasta Stir Fry",
  "Homestyle",
]

# Optional: meal picks. With a [macros] table, each notification opens
# with one combo per hall that meets your goals, drawn only from the
# stations above. Delete the table to get the plain station digest.
#
# Each nutrient takes any mix of:
#   target = 70     aim for this, within +/-15% (or set tolerance = 10)
#   min = 8         at least this much
#   max = 30        no more than this
# Nutrients: protein, carbs, fat, calories, fiber, sugar (grams),
# sodium (mg). At least one target or min is required, since limits
# alone are met by eating nothing.
#
# Of all the combos that meet every goal, the one with the fewest
# calories is picked. If none can, you get the closest one, labelled
# with the goal it misses. Numbers are per serving exactly as Nutrislice
# lists them, and dining hall data can be incomplete or wrong.
[macros]
protein = { target = 70 }
# carbs    = { max = 60 }
# fat      = { max = 30 }
# fiber    = { min = 8 }
# calories = { max = 900 }

# Per-meal overrides, merged over the goals above one nutrient at a
# time. Meal names are the same slugs as [schedule].
# [macros.brunch]
# protein = { target = 50 }

# Optional: how picks are chosen. These are the defaults.
# [picks]
# Items under this much protein are skipped when you have a protein goal.
# Without a floor, a leaf of lettuce outranks a chicken breast.
# min_item_protein_g = 15
#
# Items over this many calories are treated as bulk recipe rows (a whole
# 2473 cal pizza listed as one serving) and skipped, not corrected.
# max_item_calories = 1200
#
# A combo can repeat an item ("2x grilled chicken") up to this many
# times, and holds at most max_total_servings servings (up to 5).
# max_servings_per_item = 2
# max_total_servings = 4
#
# Tag names to exclude, matched case-insensitively. An item with no
# allergen tags is shown as "allergens unknown", never as safe.
# exclude_allergens = ["Peanuts", "Shellfish"]
#
# Items with no allergen data when you exclude allergens: "flag" (show,
# marked unknown) or "exclude" (drop them).
# unknown_allergens = "flag"

# When to send, per weekday, in your local time. Meal keys are Nutrislice
# menu_type slugs; the confirmed set is: breakfast, lunch, late-lunch,
# dinner, brunch, special.
#
# Only the weekdays you list get notifications, so simply omitting a meal
# is how you handle days a hall doesn't serve it.

[schedule.monday]
lunch = "11:15"
dinner = "17:30"

[schedule.tuesday]
lunch = "12:45"
dinner = "17:30"

[schedule.wednesday]
lunch = "11:15"
dinner = "17:30"

[schedule.thursday]
lunch = "12:45"
dinner = "17:30"

[schedule.friday]
lunch = "11:15"
dinner = "17:00"

[schedule.saturday]
brunch = "10:30"
dinner = "17:00"

# Sundays serve brunch rather than lunch -- a scheduled "lunch" here
# would find an empty menu and alert the owner.
[schedule.sunday]
brunch = "10:30"
dinner = "17:00"
