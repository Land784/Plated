# Template for a subscriber file. Copy it into a `users/` directory and
# edit, e.g. `cp users.example.toml users/wes.toml`.
#
# This template deliberately lives OUTSIDE `users/`, because `dispatch`
# sends to every file in that directory -- a placeholder left there would
# push real notifications to the guessable topic below.
#
# `users/` is gitignored here. Real subscriber files belong in the
# private runner repo. An ntfy topic is open pub/sub: anyone who knows
# the name can both read your notifications and publish fake ones to your
# phone, so treat it like a password and generate something unguessable.
#
# Subscribers invited to the web app (`menu subscribers invite`) edit
# their settings there, and the database generates their topic. Once a
# row is linked to a web account, `menu subscribers push` refuses to
# overwrite it with a file unless you pass --force, which undoes whatever
# they last saved.
#
# Generate one with the command below. Do NOT use secrets.token_urlsafe:
# ntfy topics are case-sensitive and get typed into a phone by hand, and
# that alphabet mixes case and includes 0/O and 1/l/I, which people
# reliably mistype. This alphabet excludes every confusable character.
#
#     python3 -c "import secrets; a='abcdefghjkmnpqrstuvwxyz23456789'; \
#       print('plated-' + ''.join(secrets.choice(a) for _ in range(16)))"

name = "Example"
ntfy_topic = "CHANGE-ME-to-something-unguessable"

# Eastern time; South Bend observes it. DST is handled automatically.
timezone = "America/New_York"

# North and South share only about 28% of their items on a given day, so
# both are included by default. The first hall is your preferred one: it
# leads the glance, its full menu comes first, and the push's "Full menu:"
# link points to its Nutrislice page.
halls = ["north-dining-hall", "south-dining-hall"]

# How many mains each station line names, highest protein first. The
# default is 3, the same as the database and the web app, which keeps
# the push short enough to read on a phone.
max_items_per_station = 3

# What counts as a "main" on a station line: an item with at least this
# much protein per listed serving, or one whose serving unit names a dish
# or a per-piece main ("1 taco", "1 sandwich", "1 potsticker"). A station
# with no main lists its items highest protein first instead, up to
# max_items_per_station. Display only: this is not the planner's
# [picks] min_item_protein_g and never changes what picks can choose.
main_protein_g = 10

# Allowlist of stations you actually eat at, in the order you want them
# listed. Matching ignores case and a leading "The", so "Global Compass"
# also matches North's spelling, "The Global Compass". Anything not
# listed here is never shown.
#
# Otherwise names must match Nutrislice's published spelling exactly:
# the halls publish "Homestyle 2" (checked 2026-10-07), and "Homestyle"
# would never match it. The Supabase `stations` view lists every name as
# published.
#
# One list covers every meal, and breakfast is served at its own
# stations: North's "Sunrise Kitchen" and "Bar, MYOO", South's
# "Breakfast" and "Omelets" (checked 2026-10-06). If you schedule
# breakfast, add them, or breakfast sends nothing.
stations = [
  "Domer Diner",
  "La Mesa",
  "Mezze",
  "Crust & Co",
  "Green & Grains",
  "Comfort Kitchen",
  "Athenian Rice Bowl",
  "Global Compass",
  "Curry Bar",
  "Harvest Bowl",
  "Pastaria",
  "Pasta Stir Fry",
  "Homestyle 2",
]

# Optional: stations starred in the web app, which shows them first.
# This list reorders nothing by itself; the push follows `stations`, so
# put your favorites first there too (the web app does that on save).
# favorites = ["Domer Diner", "La Mesa"]

# Optional: meal picks. With picks enabled and at least one target, each
# notification shows one plate per hall (once, if both halls pick the
# same): one main (an item the station lines would call a main) plus up
# to two sides from any food station in that hall.
#
# Targets are per meal, in grams (calories in kcal). A plate meets a
# target within +/- tolerance_pct of it. Of the plates that meet every
# target, the one closest to them wins; if none can, you get the closest
# one, labelled with the target it misses. With only a protein target,
# sides are added only to hit protein, so set calories too. Numbers are
# per serving exactly as Nutrislice lists them, and dining hall data can
# be incomplete or wrong.
[macros]
protein = 60
# carbs    = 70
# fat      = 20
# calories = 700

# How plates are built. These are the defaults, except enabled.
[picks]
enabled = true
# tolerance_pct = 15
#
# Non-main items under this many calories are never sides (no garnish).
# side_min_calories = 50
#
# The main can be up to this many servings ("2x tacos"); 1 to 3.
# max_main_servings = 2
#
# Items over this many calories are treated as bulk recipe rows (a whole
# 2473 cal pizza listed as one serving) and skipped, not corrected.
# max_item_calories = 1200
#
# Tag names to exclude, matched case-insensitively. An item with no
# allergen tags is never treated as safe; with exclusions set, a pick
# like that is marked "allergens unknown".
# exclude_allergens = ["Peanuts", "Tree Nuts", "Shellfish"]
#
# Items with no allergen data (no tags, or only labels such as "Vegan" or
# "High Performance") when you exclude allergens: "flag" (show, marked
# unknown) or "exclude" (drop them).
# unknown_allergens = "flag"

# When to send, per weekday, in your local time. Meal keys are Nutrislice
# menu_type slugs; the confirmed set is: breakfast, lunch, late-lunch,
# dinner, brunch, special.
#
# Only the weekdays you list get notifications, so simply omitting a meal
# is how you handle days a hall doesn't serve it.

[schedule.monday]
lunch = "11:15"
dinner = "17:30"

[schedule.tuesday]
lunch = "12:45"
dinner = "17:30"

[schedule.wednesday]
lunch = "11:15"
dinner = "17:30"

[schedule.thursday]
lunch = "12:45"
dinner = "17:30"

[schedule.friday]
lunch = "11:15"
dinner = "17:00"

[schedule.saturday]
brunch = "10:30"
dinner = "17:00"

# Sundays serve brunch rather than lunch -- a scheduled "lunch" here
# would find an empty menu and alert the owner.
[schedule.sunday]
brunch = "10:30"
dinner = "17:00"
